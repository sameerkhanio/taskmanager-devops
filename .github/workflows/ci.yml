
name: Task Manager CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-3
  ECR_REPOSITORY: taskmanager-devops

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::923788822780:role/taskmanager-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::923788822780:role/taskmanager-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: 923788822780.dkr.ecr.ap-northeast-3.amazonaws.com/taskmanager-devops:${{ github.sha }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Task Manager $GITHUB_SHA" \
            --parameters "$(jq -n --arg image "$IMAGE_URI" '{
              commands: [
                "set -e",
                "aws ecr get-login-password --region ap-northeast-3 | sudo docker login --username AWS --password-stdin 923788822780.dkr.ecr.ap-northeast-3.amazonaws.com",
                ("sudo docker pull " + $image),
                ("sudo docker run --rm --env-file /opt/taskmanager/.env " + $image + " python manage.py migrate --noinput"),
                "sudo docker rm -f taskmanager || true",
                ("sudo docker run -d --name taskmanager --restart unless-stopped --env-file /opt/taskmanager/.env -p 127.0.0.1:8000:8000 " + $image),
                "sudo docker cp taskmanager:/app/staticfiles/. /opt/taskmanager/staticfiles/",
                "sudo chmod -R 755 /opt/taskmanager/staticfiles",
                "echo Deployment completed"
              ]
            }')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
